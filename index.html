<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Washing Machine - Hiro Marker</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;overflow:hidden;font-family:Arial,sans-serif}
    #controlPanel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(92%,420px);
      padding:15px;background:rgba(0,0,0,.78);border-radius:18px;color:#fff;text-align:center;z-index:9999}
    #title{font-size:20px;font-weight:bold;margin-bottom:8px}
    #speedDisplay{font-size:16px;margin-bottom:12px}
    .buttonRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:bold;background:#fff;color:#222;cursor:pointer;min-width:90px}
    button:active{transform:scale(.94)}
    #status{margin-top:10px;font-size:13px;color:#b9ffb9}
  </style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true;colorManagement:true"
  arjs="sourceType:webcam;debugUIEnabled:false;">
  <a-entity light="type:ambient;intensity:1.5"></a-entity>
  <a-entity light="type:directional;intensity:2" position="2 4 3"></a-entity>

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">
    <a-entity id="washingMachine" position="0 0 0" scale=".9 .9 .9">
      <a-box position="0 1.05 0" width="1.8" height="2.1" depth="1.3" color="#e9edf2"></a-box>
      <a-box position="0 1.85 .67" width="1.55" height=".32" depth=".08" color="#20242a"></a-box>
      <a-box position="-.35 1.86 .73" width=".35" height=".16" depth=".02" color="#00e5ff"></a-box>
      <a-cylinder position=".35 1.86 .74" radius=".12" height=".06" rotation="90 0 0" color="#d9dde2"></a-cylinder>

      <a-ring position="0 1.05 .70" radius-inner=".48" radius-outer=".62" color="#252a30"></a-ring>
      <a-circle position="0 1.05 .73" radius=".48" color="#182b38"
        material="opacity:.9;metalness:.2;roughness:.1"></a-circle>

      <a-entity id="drum" position="0 1.05 .76">
        <a-cylinder radius=".39" height=".12" rotation="90 0 0" color="#7f8c8d"></a-cylinder>
        <a-ring radius-inner=".25" radius-outer=".34" color="#c8d0d5"></a-ring>
        <a-box position="0 0 .04" width=".08" height=".55" depth=".03" color="#dce1e5"></a-box>
        <a-box position="0 0 .04" width=".55" height=".08" depth=".03" color="#dce1e5"></a-box>
      </a-entity>

      <a-entity id="door" position="0 1.05 .78">
        <a-torus radius=".55" radius-tubular=".06" color="#111820"></a-torus>
      </a-entity>

      <a-cylinder position="-.65 .05 0" radius=".12" height=".18" color="#333"></a-cylinder>
      <a-cylinder position=".65 .05 0" radius=".12" height=".18" color="#333"></a-cylinder>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="controlPanel">
  <div id="title">🧺 เครื่องซักผ้า AR</div>
  <div id="speedDisplay">ความเร็วถังซัก: <strong id="speedText">1x</strong></div>
  <div class="buttonRow">
    <button onclick="toggleSpin()">▶ / ⏸</button>
    <button onclick="decreaseSpeed()">− ความเร็ว</button>
    <button onclick="increaseSpeed()">+ ความเร็ว</button>
    <button onclick="toggleDoor()">เปิด / ปิดฝา</button>
  </div>
  <div id="status">📷 กรุณาส่องกล้องไปที่ Hiro Marker</div>
</div>

<script>
const drum=document.getElementById("drum"), door=document.getElementById("door");
const speedText=document.getElementById("speedText"), statusText=document.getElementById("status");
let speed=1, spinning=false, doorOpen=false, rotation=0;

function animateDrum(){
  if(spinning && !doorOpen){
    rotation += speed*5;
    drum.setAttribute("rotation",`0 ${rotation} 0`);
  }
  requestAnimationFrame(animateDrum);
}
animateDrum();

function toggleSpin(){
  if(doorOpen){
    statusText.innerHTML="⚠️ กรุณาปิดฝาก่อนเริ่มหมุนถัง";
    return;
  }
  spinning=!spinning;
  statusText.innerHTML=spinning?"🌀 ถังซักกำลังหมุน":"⏸ ถังซักหยุดแล้ว";
}
function increaseSpeed(){
  if(speed<5){speed++;speedText.innerText=speed+"x";statusText.innerHTML="⚡ เพิ่มความเร็วถังซัก";}
}
function decreaseSpeed(){
  if(speed>1){speed--;speedText.innerText=speed+"x";statusText.innerHTML="🐌 ลดความเร็วถังซัก";}
}
function toggleDoor(){
  doorOpen=!doorOpen;
  if(doorOpen){
    spinning=false;
    door.setAttribute("animation","property:rotation;to:-75 0 0;dur:700;easing:easeOutCubic");
    statusText.innerHTML="🚪 เปิดฝาเครื่องแล้ว";
  }else{
    door.setAttribute("animation","property:rotation;to:0 0 0;dur:700;easing:easeOutCubic");
    statusText.innerHTML="🔒 ปิดฝาเครื่องแล้ว";
  }
}
const marker=document.getElementById("hiroMarker");
marker.addEventListener("markerFound",()=>statusText.innerHTML="✅ พบ Hiro Marker — เครื่องซักผ้าพร้อมใช้งาน");
marker.addEventListener("markerLost",()=>statusText.innerHTML="📷 ไม่พบ Marker — กรุณาส่องกล้องไปที่ Hiro");
</script>
</body>
</html>
